guards:
  secrets: true
  lint: false
  tests: true
  test_mode: diff
  # suite is ~275s since the TR-039 hermetic-seed tests landed; the 180s default
  # made every commit fail as "Tests timed out" (2026-09-16)
  test_timeout: 900
  test_command: ./scripts/gitreins-guard-tests.sh
  static_analysis: false
evaluator:
  model: deepseek-v4-flash
  max_iterations: 200
  max_time: "20m"
  max_input_tokens: "12M"
  static_analysis_diagnostics: false
defaults:
  model: deepseek-v4-flash
  check_for_updates: false
history:
  enabled: true
  storage: git
  max_verdicts: 1000
pipeline:
  stages: []
