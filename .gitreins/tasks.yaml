- id: TR-007
  title: "Diversity + concurrency-aware chain resolution \u2014 two-knob caps + per-model\
    \ busy skip"
  criteria:
  - resolve() applies max_consecutive_per_provider and max_total_per_provider as pruning
    on the price-ordered eligible chain (global defaults from quota-state.json diversity
    key + per-profile overrides from task_profiles columns), reporting each dropped
    hop with an explicit reason; price order preserved among survivors
  - A model at its concurrency limit is skipped individually with a 'model busy' reason
    while other models from the same provider remain in the chain
  - scripts/router_ledger.py exists with start/end/status commands writing schema-v2-subset
    rows to ledger.jsonl; router_spawn.py derives per-(provider,model) in-flight counts
    from the ledger (30min stale cutoff)
  - 'tests/test_diversity.py + tests/test_ledger.py cover: busy-model skip keeps siblings;
    consecutive cap drops 3rd-in-row; total cap drops overflow; per-profile override
    beats global default; price order preserved; no-caps behavior unchanged'
  - router_spawn.py remains fail-open (exit 0, JSON output) and outputs identical
    head/chain when no caps are configured; seed re-run adds nullable diversity columns
    to task_profiles without altering seeded profile requirements
  status: complete
  created_at: '2026-08-27T06:26:25.738507+00:00'
  completed_at: '2026-08-27T06:29:19.442035+00:00'
- id: TR-025
  title: "Runtime visibility \u2014 source + gates_loaded in resolve output"
  criteria:
  - 'Resolve JSON output gains a ''source'' field: ''registry.json'' when tables loaded
    from registry.json, ''data/tables'' when the committed fallback was used'
  - Resolve JSON output gains 'fallback_used' (true when the data/tables fallback
    fired) and a non-empty 'warnings' list naming the registry failure
  - Resolve JSON output gains 'gates_loaded' with keys health, circuit, quota (booleans
    = state file present in the state dir) and ledger_rows (int, from ledger_in_flight)
  - 'Deleting health-state.json from the state dir makes gates_loaded.health false
    and does NOT change gate behavior (fail-open preserved: resolution still succeeds,
    absent health != DOWN)'
  - Corrupt registry.json still resolves (fail-open) with source=data/tables, fallback_used=true
    and a warning
  status: complete
  created_at: '2026-08-28T05:17:28.482223+00:00'
  completed_at: '2026-08-28T05:17:32.805268+00:00'
- id: tr-026-ledger
  title: Ledger wiring or visible disable (TR-026)
  criteria:
  - 'scripts/router_ledger.py status --json reports wired:false + rows:0 + started_open:0
    when the ledger file is empty or missing, and wired:true once a trace row exists
    (verified by tests/test_ledger.py: test_status_empty_or_missing_file_exit0, test_status_empty_file_reports_unwired_loudly,
    test_status_json_parses asserting wired:true)'
  - 'router_spawn.py resolve() output emits a ''spawn ledger NOT WIRED'' warning and
    gates_loaded.ledger=false whenever ledger.jsonl has no trace rows (gates_loaded.ledger_rows
    still emitted); a ledger WITH a fresh started row flips ledger to true and drops
    the warning (tests/test_visibility.py: test_empty_ledger_reports_unwired_loudly,
    test_missing_ledger_file_reports_unwired, test_ledger_with_trace_reports_wired)'
  - 'docs/integration.md documents the TR-026 decision: path B visible-disable chosen
    because wiring requires scheduler Go code (coding-hermes-scheduler TASK-ROUTER-002
    call side, spawn.go tick-ID plumbing) which task-router must not touch per AGENTS.md;
    README.md marks router_ledger.py NOT WIRED'
  - Full test suite passes with only the 2 pre-existing TR-029 failures untouched
    (P9_REVIEW + fallback lane); gitreins guard Tier 1 PASS (secrets + tests)
  status: complete
  created_at: '2026-08-28T05:34:21.293877+00:00'
  completed_at: '2026-08-28T05:34:26.057270+00:00'
