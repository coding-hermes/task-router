    head/chain when no caps are configured; seed re-run adds nullable diversity columns
    to task_profiles without altering seeded profile requirements
  status: complete
  created_at: '2026-08-27T06:26:25.738507+00:00'
  completed_at: '2026-08-27T06:29:19.442035+00:00'
