name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Release verification: CI must run (and stay green) on the v0.2.0 tag
  # commit, but tag pushes are not push-events on branches — dispatch it.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # RELEASE-005: full suite outgrew 10m — runs on e14b744+ were cancelled mid-suite. INT-CI-20261002-01: the guard-parity step now REALLY runs (guard script works in CI since 6060e9a), so the job fits TWO full-suite runs (~19 min each on runners) — 45 min covers both + setup.
    # NOTE (TR-203 follow-up, run 37747633956): there is deliberately NO
    # job-level `env: ROUTER_STATE_DIR:` here. Two things break with one:
    #   * task_router.cli._apply_env_exports uses os.environ.setdefault to
    #     redirect `router circuit` etc. into the test's tmp data home — an
    #     ambient var pre-empts EVERY setdefault, and
    #     tests/test_cli_paths.py::test_circuit_status_end_to_end_in_tmp_home
    #     fails ("circuit state did not land in data home", reproduced
    #     locally; run 37761941822).
    #   * 35+ test modules import router_server/router_quota at COLLECTION
    #     time, so router_quota.STATE_DIR freezes from the ambient env before
    #     any fixture could set it.
    # The fix is filesystem-shaped instead: the first step seeds the DEFAULT
    # state dir ($HOME/.hermes/model-router) with the ci-mirror policy. Then
    # the TR-288 in-flight demotion writer (router_server._demote_on_taxonomy
    # -> router_quota.quota_set) that tests/test_proxy_deadline_contract.py's
    # 402 hop triggers mid-suite (module-scope import freezes STATE_DIR to the
    # default BEFORE the fixture's monkeypatch lands; only _subprocess_text is
    # stubbed, not the quota write) lands its stray quota_exhausted rows in a
    # plane that already carries every provider's row — read-modify-write
    # preserves them, and tests/test_policy_gate_coverage.py (the guard step's
    # fresh pytest process) audits a REAL deployment plane instead of
    # skipping (suite step: file absent early -> skip) or failing 29
    # "policy-gate-missing-row" (run 37747633956).
    steps:
      - uses: actions/checkout@v4
        with:
          # TR-202 follow-up 2026-09-29: tests reference history
          # (test_tr168 pins data state against 1fcd9aa) — default depth-1
          # checkout made `git show 1fcd9aa:...` exit 128 in CI while the
          # same test passed locally. Repo history is text-JSONL; full
          # fetch is cheap.
          fetch-depth: 0

      - name: Router state plane at the default path (ci-mirror)
        run: |
          # Seed $HOME/.hermes/model-router — the DEFAULT state dir every
          # router script resolves when ROUTER_STATE_DIR is unset — with the
          # same ci-mirror policy the Fresh-clone smoke step uses:
          # grok-build/crof GATED, everything else open, no circuits, all
          # providers healthy. A runner then looks like a DEPLOYED box to
          # the policy-gate coverage gate (which audits the real plane and
          # keeps its teeth: an un-onboarded provider still fails it), and
          # stray state writes from suite tests stay inside a file that
          # never loses a provider row.
          mkdir -p "$HOME/.hermes/model-router"
          python3 - "$HOME/.hermes/model-router" <<'EOF'
          import json, os, sys
          state = sys.argv[1]
          provs = {}
          for line in open('data/tables/providers.jsonl'):
              p = json.loads(line)
              provs[p['id']] = {'status': 'gated', 'reason': 'ci-mirror'} if p['id'] in ('grok-build', 'crof') else {'status': 'open'}
          json.dump({'updated': 'ci', 'providers': provs},
                    open(os.path.join(state, 'quota-state.json'), 'w'))
          json.dump({'providers': {pid: {'status': 'open'} for pid in provs}},
                    open(os.path.join(state, 'health-state.json'), 'w'))
          json.dump({'version': 1, 'pairs': {}},
                    open(os.path.join(state, 'circuit-state.json'), 'w'))
          print('router state seeded at', state, ':',
                len(provs), 'providers (ci-mirror: grok-build/crof gated)')
          EOF

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: pip install --quiet pytest duckdb pyyaml  # seed subprocess + several tests use the duckdb engine; router_probe_run.py loads config.yaml

      - name: Seed registry (registry.json is gitignored — CI must generate it)
        run: python3 -m scripts.router_seed

      - name: Full test suite (pure JSON — no duckdb needed)
        run: python3 -m pytest -q tests/ -p no:cacheprovider

      - name: Guard test command (gitreins parity)
        run: bash scripts/gitreins-guard-tests.sh

      - name: Fresh-clone resolve smoke (stdlib, hermetic state)
        run: |
          # A missing router-state dir means "every provider quota-gated" by
          # design (fail-closed when state is unknown — see test_diversity
          # _open_providers). CI writes a hermetic state dir mirroring prod:
          # grok-build/crof GATED, everything else open, no circuits, all
          # providers healthy.
          STATE=$(mktemp -d)
          python3 - "$STATE" <<'EOF'
          import json, os, sys
          state = sys.argv[1]
          provs = {}
          for line in open('data/tables/providers.jsonl'):
              p = json.loads(line)
              provs[p['id']] = {'status': 'gated', 'reason': 'ci-mirror'} if p['id'] in ('grok-build', 'crof') else {'status': 'open'}
          json.dump({'updated': 'ci', 'providers': provs}, open(os.path.join(state, 'quota-state.json'), 'w'))
          json.dump({'providers': {pid: {'status': 'open'} for pid in provs}}, open(os.path.join(state, 'health-state.json'), 'w'))
          json.dump({'pairs': {}}, open(os.path.join(state, 'circuit-state.json'), 'w'))
          EOF
          export ROUTER_STATE_DIR="$STATE"
          python3 scripts/router_spawn.py coding-hermes-scheduler --format json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['head'] is not None, 'empty head: %s' % d['exclusions'][:3]; print('head:', d['head']['provider'] + '/' + d['head']['model'], d['head']['usd_1m'])"
          python3 scripts/router_spawn.py --list-profiles | grep -q P0_FORE && echo "profiles ok"

      - name: Registry integrity
        run: |
          python3 - <<'EOF'
          import glob
          tables = {f.split('/')[-1][:-6]: sum(1 for l in open(f) if l.strip()) for f in glob.glob('data/tables/*.jsonl')}
          assert tables['models'] >= 50, tables
          assert tables['model_perf'] >= 900, tables  # family-dedupe reduced rows; floor reflects data
          assert tables['task_profiles'] >= 8, tables
          print('data/tables ok:', {k: v for k, v in sorted(tables.items())})
          EOF

      # TR-201: null-debt PREVENTION invariants — the wipe-shape (INV1), the
      # dead-column shape (INV2) and anonymous lifecycle dates (INV3, the
      # TR-199 R4 predicate) fail the push. Runs on the committed data/
      # tables; scratch-dir behavior is pinned by
      # tests/test_null_debt_invariants.py in the suite step above.
      - name: Null-debt invariants (TR-201)
        run: python3 scripts/null_debt_invariants.py

      # ---------------------------------------------------------------------
      # Proxy-path harnesses (TR-186): scripts/proxy_acceptance.py,
      # scripts/proxy_smoke.py, scripts/dummy_scheduler.py.
      #
      # NONE of the three runs as a CI leg, deliberately:
      #
      # * proxy_acceptance.py is LIVE-ONLY by design, not hermetic. Its own
      #   docstring: "Every check measures the LIVE services — no fixtures,
      #   no simulated upstreams pretending to be the fleet." It measures the
      #   live proxy (ROUTER_PROXY_URL, default 127.0.0.1:9391) and web UI
      #   (:9093), reads the gateway credential from ~/.hermes/.env, asserts
      #   custody against the LIVE fleet ledger (data/state/outcomes.jsonl)
      #   and ~/.hermes/state.db, and its health gate requires a proxy whose
      #   loaded commit equals this checkout's HEAD and stale=false. A scratch
      #   instance with fake upstreams cannot satisfy those gates, and pointed
      #   at a dead port the battery crashes red in <1s (uncaught URLError;
      #   measured 2026-09-26). A CI leg would be guaranteed red and mean
      #   nothing. Run it by hand before repointing the scheduler — see
      #   docs/proxy-readiness-report-2026-09-26.html.
      #
      # * proxy_smoke.py sends real model traffic at --base (default: the live
      #   proxy) and refuses to run without a credential from ~/.hermes/.env
      #   (exit 2, measured in a CI-shaped HOME). There is no scratch proxy in
      #   this repo to point it at, so there is no bounded CI leg to add. The
      #   bounded shape, if one ever exists, is:
      #     timeout 120 python3 scripts/proxy_smoke.py --n 2 --concurrency 1
      #       --timeout 20 --base http://127.0.0.1:<scratch-port>
      #
      # * dummy_scheduler.py must NEVER run in CI. It is a LOAD GENERATOR: it
      #   exists to reproduce the TR-164 incident (proxied tick traffic
      #   amplified into real upstream model calls, saturated the gateway and
      #   tripped provider circuits fleet-wide). Every request costs real
      #   upstream tokens; on a runner it would hammer whatever answers on its
      #   default port and burn quota for zero signal.
      #
      # The step below guards that decision instead: it byte-compiles all three
      # harnesses (cheap syntax-rot gate — nothing in the pytest import graph
      # imports them) and fails the job if a run section in THIS workflow ever
      # starts invoking any of the three.
      - name: Proxy harness guard (compile + no-live-harness tripwire)
        run: |
          python3 - <<'EOF'
          import os, py_compile, re, tempfile
          for s in ("proxy_acceptance.py", "proxy_smoke.py", "dummy_scheduler.py"):
              with tempfile.NamedTemporaryFile(suffix=".py", delete=False) as tf:
                  dst = tf.name
              try:
                  py_compile.compile(os.path.join("scripts", s), cfile=dst, doraise=True)
              finally:
                  os.unlink(dst)
          print("compile clean: scripts/proxy_acceptance.py, scripts/proxy_smoke.py,"
                " scripts/dummy_scheduler.py")
          run_blocks, cur = [], None
          for line in open(".github/workflows/ci.yml"):
              m = re.match(r"\s*-\s*name:\s*(.+)$", line)
              if m:
                  cur = m.group(1).strip()
              elif cur is not None and re.match(r"\s*run:", line):
                  run_blocks.append(cur)
                  cur = None
          assert len(run_blocks) >= 5, (
              "tripwire parsed only %d run sections - parser drift, fix it" % len(run_blocks))
          banned = [n for n in run_blocks
                    if re.search(r"proxy_acceptance|proxy_smoke|dummy_scheduler", n)]
          assert not banned, (
              "live-only proxy harnesses must NOT run in CI (see the TR-186 comment): %s"
              % banned)
          print("tripwire ok: %d run sections, none invokes the live-only proxy harnesses"
                % len(run_blocks))
          EOF
