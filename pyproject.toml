[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-router"
version = "0.2.0"
description = "Deterministic task router CLI for the coding-hermes fleet — wraps the scripts/ tools behind one `router` entry point with a configurable data home."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Bane", email = "wojonstech@gmail.com"}]
# stdlib only — scripts/ tools must run in the bare board venv.

[project.optional-dependencies]
# NOT runtime deps (runtime stays stdlib-only). Only what make test needs:
# pytest runs the suite; duckdb is imported by scripts/router_seed.py, which
# tests/conftest.py runs once per session to build the shared tables fixture;
# pyyaml is imported by scripts/router_probe_run.py (config.yaml loader,
# INT-CI-20260928-01).
test = ["pytest", "duckdb", "pyyaml"]
# QA-TASKROUTER-5: `dev` is the advertised developer install path
# (`pip install -e .[dev]`). Self-referential extra — resolves to everything
# `test` needs without duplicating the list (valid PEP 621 + setuptools).
dev = ["task-router[test]"]

[project.scripts]
router = "task_router.cli:main"

[tool.setuptools]
# Package ONLY task_router/ — scripts/ stay repo-relative runtime tools,
# dispatched in place (runpy) so the installed CLI always tracks the repo.
packages = ["task_router"]

[tool.ruff]
# TR-REV-20261027-01: pin the lint ruleset so every ruff version (0.15..0.17+)
# judges the same set. Default rules = E4/E7/E9/F (pycodestyle subset +
# pyflakes); I adds import sorting (the I001 class this row fixed). E402 is
# DELIBERATE: router_server.py / router_spawn.py bootstrap sys.path to import
# sibling runtime modules before their imports — that pattern IS the file's
# structure, not an accident.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# test helpers import repo modules after sys.path surgery
"tests/*" = ["E402"]
